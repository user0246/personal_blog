<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} — Personal Blog</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="header">
    <div class="container">
        <a href="/" class="logo">Personal Blog</a>

    <nav>
        <a href="/">Home</a>
        <a href="/dashboard">Dashboard</a>
    </nav>
</div>

</header>

<main class="container">
    <article class="single-post">
        <a href="/" class="back-link">← Back to articles</a>

    <h1>{{ post.title }}</h1>

    <p class="post-date">
        {{ post.time.strftime("%d.%m.%Y %H:%M") }}
    </p>

    <div class="post-content">
        {{ post.content }}
    </div>
</article>

</main>

</body>
</html>
